# ---------------------------------------------------------------------------
# phpboyscout/terraform-aws-signing-kms CI pipeline.
#
# Imports the reusable components from phpboyscout/cicd. Each component
# runs in registry.gitlab.com/phpboyscout/images/infra-tools at the tag
# pinned by the component's image_version default. Renovate keeps the
# @vX.Y.Z component refs current as cicd cuts new releases.
#
# Release flow: releaser-pleaser watches `main` and maintains a release
# MR carrying the pending changelog + version bump. Merging the release
# MR cuts a `vX.Y.Z` tag whose pipeline runs `tofu-module-publish`,
# which pushes the module to the GitLab module registry under
# `gitlab.com/phpboyscout/signing-kms/aws`.
#
# Single-module repo: the module HCL lives at the root, with one
# examples/minimal/ fixture exercising the caller contract under
# `tofu validate`. No sub-modules.
#
# Required CI variables:
#   RELEASER_PLEASER_TOKEN — project access token, Maintainer role,
#     scopes: api, read_repository, write_repository. Used by the
#     release-mr job to push CHANGELOG updates and the release tag.
# ---------------------------------------------------------------------------

stages:
  - lint
  - security
  - test
  - pages
  - release
  - renovate
  - .post

include:
  # Release-MR pattern — our wrapper over apricote/releaser-pleaser. Injects
  # its job into the `release` stage on the default branch; the job reads
  # conventional commits and opens/updates a "Release" MR. Merging that MR
  # creates the tag whose pipeline runs tofu-module-publish below. The
  # wrapper carries the schedule-never guard so it no longer fires on the
  # Renovate schedule.
  - component: gitlab.com/phpboyscout/cicd/releaser-pleaser@v0.29.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

  - component: gitlab.com/phpboyscout/cicd/tofu-lint@v0.29.0
    inputs:
      stage: lint
      # `.` runs `tofu fmt -recursive` from root (covers everything) and
      # `tflint --chdir=. --recursive`. terraform-docs runs against
      # the module root + the example so any README table drift is
      # caught on PR.
      paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-security@v0.29.0
    inputs:
      stage: security
      # Single path; trivy / checkov walk the tree themselves and
      # gitleaks scans every tracked file regardless.
      paths: "."

  - component: gitlab.com/phpboyscout/cicd/tofu-validate@v0.29.0
    inputs:
      stage: test
      # Module root + the example fixture. tofu-validate skips any
      # dir without *.tf files automatically.
      validate_paths: ". examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.29.0
    inputs:
      stage: pages
      # zensical.toml + docs/ + requirements-lock.txt all at repo root.
      # Defaults (working_directory=., docs_path=docs,
      # python_lock=requirements-lock.txt, deploy_branch=main) match.

  # Publish to the GitLab Terraform Module Registry on each vX.Y.Z tag
  # that releaser-pleaser cuts. Runs in .post via CI_JOB_TOKEN
  # (own-project package write); consumers then reference
  # gitlab.com/phpboyscout/signing-kms/aws + version.
  - component: gitlab.com/phpboyscout/cicd/tofu-module-publish@v0.29.0
    inputs:
      module_name: signing-kms
      # module_system defaults to "aws".

  # Nightly Renovate scan (schedule-gated on $RENOVATE_TASK=scan). Keeps
  # both the code dependencies and the pinned phpboyscout/cicd component
  # refs current, via the cicd preset extended in renovate.json. Runs only
  # on the renovate-daily pipeline schedule; the other jobs self-exclude
  # from schedule pipelines.
